<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cancionero LAN MUSIC</title>

<style>
  :root {
    --bg:        #0e0e0f;
    --surface:   #161618;
    --card:      #1c1c1f;
    --border:    #2a2a2e;
    --accent:    #c8a96e;
    --accent2:   #7eb8a4;
    --text:      #e8e4dc;
    --muted:     #7a7870;
    --chord:     #c8a96e;
    --danger:    #e07b6a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── HEADER ── */
  header {
    padding: 24px 32px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
  }
  .logo {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 22px;
    letter-spacing: 0.02em;
    color: var(--accent);
  }
  .logo span { color: var(--text); font-style: italic; }
  .team-badge {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 20px;
  }

  /* ── LAYOUT ── */
  .app {
    display: flex;
    flex: 1;
    height: calc(100vh - 65px);
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 280px;
    min-width: 280px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-header {
    padding: 20px 20px 12px;
    border-bottom: 1px solid var(--border);
  }
  .search-box {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 14px;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-box::placeholder { color: var(--muted); }
  .search-box:focus { border-color: var(--accent); }

  .songs-list {
    overflow-y: auto;
    flex: 1;
    padding: 8px 0;
  }
  .song-item {
    padding: 14px 20px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: all 0.15s;
  }
  .song-item:hover { background: var(--card); }
  .song-item.active {
    background: var(--card);
    border-left-color: var(--accent);
  }
  .song-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 3px;
  }
  .song-meta {
    font-size: 11px;
    color: var(--muted);
    display: flex;
    gap: 8px;
  }
  .song-key {
    color: var(--accent2);
    font-family: 'Courier New', Courier, monospace;
    font-size: 10px;
    background: rgba(126,184,164,0.1);
    padding: 1px 6px;
    border-radius: 4px;
  }

  /* ── MAIN ── */
  .main {
    flex: 1;
    overflow-y: auto;
    padding: 36px 48px;
    max-width: 820px;
  }

  .song-header {
    margin-bottom: 32px;
  }
  .song-name {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 36px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.1;
    margin-bottom: 8px;
  }
  .song-info {
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
    margin-top: 12px;
  }
  .info-pill {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .info-pill strong { color: var(--accent); font-weight: 600; }

  /* ── TRANSPOSE ── */
  .transpose-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0 32px;
    padding: 14px 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .transpose-label {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    white-space: nowrap;
  }
  .btn-transpose {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    font-weight: 300;
  }
  .btn-transpose:hover { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .current-key {
    font-family: 'Courier New', Courier, monospace;
    font-size: 20px;
    font-weight: 600;
    color: var(--accent);
    min-width: 48px;
    text-align: center;
  }
  .semitone-count {
    font-size: 11px;
    color: var(--muted);
    margin-left: 4px;
  }
  .btn-reset {
    margin-left: auto;
    font-size: 11px;
    color: var(--muted);
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 12px;
    cursor: pointer;
    letter-spacing: 0.06em;
    transition: all 0.15s;
  }
  .btn-reset:hover { color: var(--text); border-color: var(--muted); }

  /* ── LYRICS ── */
  .lyrics-block {
    margin-bottom: 28px;
  }
  .section-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent2);
    margin-bottom: 12px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .lyric-line {
    display: flex;
    flex-direction: column;
    margin-bottom: 6px;
    line-height: 1.3;
  }
  .chords-row {
    font-family: 'Courier New', Courier, monospace;
    font-size: 13px;
    font-weight: 600;
    color: var(--chord);
    white-space: pre;
    letter-spacing: 0.04em;
    min-height: 18px;
  }
  .words-row {
    font-size: 15px;
    color: var(--text);
    line-height: 1.8;
    white-space: pre-wrap;
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--muted);
    text-align: center;
    gap: 12px;
  }
  .empty-icon { font-size: 48px; opacity: 0.3; }
  .empty-text { font-size: 15px; }
  .empty-sub { font-size: 13px; opacity: 0.7; }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  @media (max-width: 640px) {
    .sidebar { width: 100%; min-width: unset; }
    .app { flex-direction: column; height: auto; }
    .main { padding: 24px 20px; }
    .song-name { font-size: 26px; }
    #song-view { display: none; }
    #song-view.visible { display: block; }
    .sidebar { display: block; }
    .sidebar.hidden { display: none; }
    .back-btn { display: flex !important; }
  }
  .back-btn {
    display: none;
    align-items: center;
    gap: 8px;
    color: var(--bg);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 24px;
    background: var(--accent);
    border: none;
    padding: 12px 20px;
    border-radius: 10px;
    width: 100%;
    justify-content: center;
    letter-spacing: 0.04em;
    transition: opacity 0.2s;
  }
  .back-btn:hover { opacity: 0.85; }42%  { left: calc(100% + 100px); }
    42.01% { left: -100px; }
    84%  { left: calc(100% + 100px); }
    84.01% { left: calc(100% + 100px); opacity: 1; }
    100% { left: calc(100% + 100px); opacity: 0; }
  }

  /* ── WALKER ── */
  #walker-wrap {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 80px;
    pointer-events: none;
    z-index: 9999;
    overflow: hidden;
  }
  #walker {
    position: absolute;
    top: -8px;
    left: -120px;
    width: 70px;
    height: auto;
    mix-blend-mode: screen;
    image-rendering: pixelated;
    animation: walkAcross 10s linear forwards;
  }
  @keyframes walkAcross {
    0%        { left: -120px; opacity: 1; }
    45%       { left: calc(100% + 120px); opacity: 1; }
    45.01%    { left: -120px; opacity: 1; }
    90%       { left: calc(100% + 120px); opacity: 1; }
    90.01%    { left: calc(100% + 120px); opacity: 1; }
    100%      { left: calc(100% + 120px); opacity: 0; }
  }
</style>
</head>

// ── TRANSPOSICIÓN ───────────────────────────────────────────────────────────
const CHROMATIC = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const ENHARMONIC = { 'Db':'C#','Eb':'D#','Gb':'F#','Ab':'G#','Bb':'A#' };

let currentSong = null;
let semitoneOffset = 0;

function normalizeNote(n) {
  return ENHARMONIC[n] || n;
}

function transposeNote(note, steps) {
  const norm = normalizeNote(note);
  const idx = CHROMATIC.indexOf(norm);
  if (idx === -1) return note;
  return CHROMATIC[(idx + steps + 12) % 12];
}

function transposeChord(chord, steps) {
  if (steps === 0) return chord;
  return chord.replace(/[A-G](?:#|b)?/g, (match) => {
    const norm = normalizeNote(match);
    return transposeNote(norm, steps);
  });
}

function transposeChordLine(line, steps) {
  return line.replace(/[A-G](?:#|b)?(?:m|maj|min|dim|aug|sus|add)?(?:\d)?(?:\/[A-G](?:#|b)?)?/g, (chord) => {
    return transposeChord(chord, steps);
  });
}

function getTransposedKey(originalKey, steps) {
  const root = originalKey.replace(/m.*$/, '');
  const suffix = originalKey.slice(root.length);
  return transposeNote(normalizeNote(root), steps) + suffix;
}

// ── RENDER ──────────────────────────────────────────────────────────────────
function renderSong(song, offset) {
  const container = document.getElementById('lyrics-container');
  container.innerHTML = '';

  song.sections.forEach(section => {
    const block = document.createElement('div');
    block.className = 'lyrics-block';

    const label = document.createElement('div');
    label.className = 'section-label';
    label.textContent = section.name;
    block.appendChild(label);

    section.lines.forEach(line => {
      const lineDiv = document.createElement('div');
      lineDiv.className = 'lyric-line';

      const chordsDiv = document.createElement('div');
      chordsDiv.className = 'chords-row';
      chordsDiv.textContent = transposeChordLine(line.chords, offset);

      const lyricsDiv = document.createElement('div');
      lyricsDiv.className = 'words-row';
      lyricsDiv.textContent = line.lyrics;

      lineDiv.appendChild(chordsDiv);
      lineDiv.appendChild(lyricsDiv);
      block.appendChild(lineDiv);
    });

    container.appendChild(block);
  });
}

function updateKeyDisplay() {
  const key = getTransposedKey(currentSong.key, semitoneOffset);
  document.getElementById('current-key-display').textContent = key;
  const diff = semitoneOffset;
  document.getElementById('semitone-display').textContent =
    diff === 0 ? '(original)' : diff > 0 ? `(+${diff} semitonos)` : `(${diff} semitonos)`;
}

function transpose(steps) {
  semitoneOffset = (semitoneOffset + steps + 12) % 12;
  if (semitoneOffset > 6) semitoneOffset -= 12;
  renderSong(currentSong, semitoneOffset);
  updateKeyDisplay();
}

function resetTranspose() {
  semitoneOffset = 0;
  renderSong(currentSong, 0);
  updateKeyDisplay();
}

// ── SONG SELECTION ──────────────────────────────────────────────────────────
function selectSong(song) {
  currentSong = song;
  semitoneOffset = 0;

  document.querySelectorAll('.song-item').forEach(el => el.classList.remove('active'));
  document.querySelector(`.song-item[data-id="${song.id}"]`)?.classList.add('active');

  document.getElementById('display-title').textContent = song.title;
  document.getElementById('display-artist').textContent = song.artist;
  document.getElementById('display-key').textContent = song.key;
  document.getElementById('current-key-display').textContent = song.key;
  document.getElementById('semitone-display').textContent = '(original)';

  renderSong(song, 0);

  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('song-content').style.display = 'block';

  // Mobile
  if (window.innerWidth <= 640) {
    document.getElementById('sidebar').classList.add('hidden');
    document.getElementById('song-view').classList.add('visible');
  }
}

function goBack() {
  document.getElementById('sidebar').classList.remove('hidden');
  document.getElementById('song-view').classList.remove('visible');
}

// ── SIDEBAR LIST ────────────────────────────────────────────────────────────
function buildSongList(songs) {
  const list = document.getElementById('songs-list');
  list.innerHTML = '';
  if (songs.length === 0) {
    list.innerHTML = '<div style="padding:20px;color:var(--muted);font-size:13px;text-align:center">Sin resultados</div>';
    return;
  }
  songs.forEach(song => {
    const item = document.createElement('div');
    item.className = 'song-item' + (currentSong?.id === song.id ? ' active' : '');
    item.dataset.id = song.id;
    item.innerHTML = `
      <div class="song-title">${song.title}</div>
      <div class="song-meta">
        <span>${song.artist}</span>
        <span class="song-key">${song.key}</span>
      </div>
    `;
    item.onclick = () => selectSong(song);
    list.appendChild(item);
  });
}

function normalize(str) {
  return str.toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '');
}

function filterSongs(query) {
  const q = normalize(query);
  const filtered = SONGS.filter(s =>
    normalize(s.title).includes(q) || normalize(s.artist).includes(q)
  ).sort((a, b) => a.title.localeCompare(b.title, 'es'));
  buildSongList(filtered);
}

// ── INIT ────────────────────────────────────────────────────────────────────
SONGS.sort((a, b) => a.title.localeCompare(b.title, 'es'));
buildSongList(SONGS);
